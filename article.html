<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BasketTap — Basketball News Article</title>
  <meta name="description" content="Read the latest NBA and basketball news on BasketTap. In-depth coverage of players, teams, game results and highlights." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#ff6a00" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <!-- Open Graph (updated dynamically via JS) -->
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="BasketTap" />
  <meta property="og:title" content="BasketTap — Basketball News" />
  <meta property="og:description" content="Read the latest NBA and basketball news on BasketTap." />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BasketTap — Basketball News" />
  <meta name="twitter:description" content="Read the latest NBA and basketball news on BasketTap." />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange:  #ff6a00;
      --diamond: #67e8f9;
      --green:   #22c55e;
      --bg:      #0a0a0a;
      --surface: #141414;
      --surface2:#1e1e1e;
      --text:    #e8e8e8;
      --muted:   rgba(255,255,255,0.72);
      --border:  rgba(255,255,255,0.08);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { height:100%; overflow-x:hidden; }
    body {
      min-height:100%; background:var(--bg);
      font-family:'Inter',sans-serif; color:var(--text);
      animation:fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    /* ── GAME PROMO ── */
    .game-promo {
      display:flex; align-items:center; gap:28px;
      margin-top:44px; padding:28px 32px;
      background:linear-gradient(135deg,rgba(255,106,0,0.12) 0%,rgba(255,106,0,0.04) 100%);
      border:1px solid rgba(255,106,0,0.28); border-radius:16px;
    }
    .game-promo-ball { flex-shrink:0; width:72px; height:72px; border-radius:50%;
      background:radial-gradient(circle at 34% 30%,#ffc060 0%,#ff8c00 34%,#cc5500 66%,#7a2800 100%);
      box-shadow:0 0 28px rgba(255,106,0,0.40), inset -6px -6px 16px rgba(0,0,0,0.45);
      animation:promoSpin 14s linear infinite;
      position:relative; overflow:hidden;
    }
    .game-promo-ball svg { position:absolute; inset:0; width:100%; height:100%; border-radius:50%; overflow:hidden; }
    @keyframes promoSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .game-promo-label { font-size:9px; font-weight:700; letter-spacing:3px; text-transform:uppercase;
      color:var(--orange); margin-bottom:6px; }
    .game-promo-title { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:2px;
      color:#fff; margin-bottom:6px; }
    .game-promo-desc  { font-size:12px; color:var(--muted); line-height:1.60; margin-bottom:14px; }
    .game-promo-btn {
      display:inline-flex; align-items:center; gap:8px;
      background:var(--orange); border:none; border-radius:50px;
      padding:10px 28px;
      font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:3px; color:#fff;
      text-decoration:none; cursor:pointer;
      transition:opacity 0.15s, transform 0.1s;
    }
    .game-promo-btn:hover  { opacity:0.88; }
    .game-promo-btn:active { transform:scale(0.96); }
    @media (max-width:600px) {
      .game-promo { flex-direction:column; text-align:center; padding:22px 20px; gap:16px; }
      .game-promo-ball { width:56px; height:56px; }
    }

    /* ── HEADER ── */
    header {
      position:sticky; top:0; z-index:50;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 28px; height:50px;
      background:rgba(10,10,10,0.92);
      border-bottom:1px solid rgba(30,120,255,0.22);
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    }
    .logo { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:6px; color:var(--orange); text-decoration:none; }
    .back-btn {
      display:flex; align-items:center; gap:6px;
      font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase;
      color:var(--muted); text-decoration:none; cursor:pointer; background:none; border:none;
      transition:color 0.15s; -webkit-tap-highlight-color:transparent;
    }
    .back-btn:hover { color:var(--text); }

    /* ── PAGE ── */
    .art-page {
      max-width:780px; margin:0 auto;
      padding:40px 24px 80px;
    }

    /* Image */
    .art-img-wrap {
      width:100%; border-radius:14px; overflow:hidden;
      background:var(--surface2); margin-bottom:28px;
      display:flex; align-items:center; justify-content:center;
    }
    .art-img-wrap img { width:100%; height:auto; display:block; }
    .no-img-big { width:100%; height:260px; display:flex; align-items:center; justify-content:center; font-size:72px; }

    /* Meta */
    .art-badge {
      display:inline-block; font-size:9px; font-weight:700;
      letter-spacing:1.5px; text-transform:uppercase;
      padding:4px 10px; border-radius:5px; color:#fff; margin-bottom:14px;
    }
    .art-badge.players { background:var(--orange); }
    .art-badge.teams   { background:#0ea5e9; }
    .art-badge.matches { background:var(--green); }
    .art-badge.general { background:rgba(255,255,255,0.15); }

    .art-title {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(28px,4vw,48px);
      letter-spacing:2px; color:#fff; line-height:1.1;
      margin-bottom:12px;
    }

    .art-date {
      font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
      color:var(--muted); margin-bottom:22px;
    }

    .art-divider { width:48px; height:2px; background:var(--orange); border-radius:2px; margin-bottom:22px; }

    .art-desc {
      font-size:16px; color:rgba(255,255,255,0.88);
      line-height:1.75; margin-bottom:20px; font-weight:500;
    }

    .art-body {
      font-size:14px; color:rgba(255,255,255,0.72);
      line-height:1.85; margin-bottom:36px;
    }

    .art-full-hint {
      font-size:11px; color:var(--muted); letter-spacing:1px;
      margin-bottom:16px; padding:12px 16px;
      border:1px solid var(--border); border-radius:8px;
      background:var(--surface2);
    }

    /* External link button */
    .art-ext-btn {
      display:inline-flex; align-items:center; gap:10px;
      padding:14px 32px; background:var(--orange);
      border-radius:50px; text-decoration:none;
      font-family:'Bebas Neue',sans-serif; font-size:18px;
      letter-spacing:3px; color:#fff;
      transition:opacity 0.15s, transform 0.1s;
    }
    .art-ext-btn:hover  { opacity:0.88; }
    .art-ext-btn:active { transform:scale(0.97); }
    .art-ext-arrow { font-size:16px; }

    @media (max-width:600px) {
      header { padding:0 16px; }
      .art-page { padding:24px 16px 60px; }
      .art-title { font-size:clamp(26px,7vw,40px); }
      .art-desc  { font-size:14px; }
      .art-body  { font-size:13px; }
    }
  </style>
</head>
<body>
<script>(function(){var d=sessionStorage.getItem('bt_dir');sessionStorage.removeItem('bt_dir');if(d==='back')document.body.classList.add('back');})()</script>

<header>
  <a class="logo" href="home.html">BasketTap</a>
  <a class="back-btn" href="news.html" onclick="goBack(event)">← Back to News</a>
</header>

<div class="art-page" id="art-page">
  <div style="padding:80px 0;text-align:center;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;">
    Loading article...
  </div>
</div>

<!-- Game promo ad -->
<div class="art-page" style="padding-top:0" id="game-promo-wrap" hidden>
  <div class="game-promo">
    <div class="game-promo-ball">
      <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
        <path d="M130 8 Q178 68 178 130 Q178 192 130 252" stroke="rgba(50,12,0,.58)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M130 8 Q82 68 82 130 Q82 192 130 252"   stroke="rgba(50,12,0,.58)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M8 130 Q68 96 130 96 Q192 96 252 130"   stroke="rgba(50,12,0,.58)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M8 130 Q68 164 130 164 Q192 164 252 130" stroke="rgba(50,12,0,.58)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="88" cy="78" rx="28" ry="13" fill="rgba(255,235,160,.10)" transform="rotate(-22,88,78)"/>
      </svg>
    </div>
    <div>
      <div class="game-promo-label">Free Browser Game</div>
      <div class="game-promo-title">Play BasketTap</div>
      <p class="game-promo-desc">The free online basketball tap clicker — tap to score, unlock upgrades and dominate. No download, no account needed.</p>
      <a class="game-promo-btn" href="index.html">Play Now →</a>
    </div>
  </div>
</div>

<script>
function goBack(e) {
  e.preventDefault();
  sessionStorage.setItem('bt_dir', 'back');
  document.body.style.animation = 'pageOutBack 0.27s cubic-bezier(0.55,0,1,0.45) forwards';
  setTimeout(() => { window.location.href = 'news.html'; }, 270);
}

function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
  catch(e) { return ''; }
}

function getCatType(a) {
  if (a.categories?.some(c => c.type === 'athlete')) return 'players';
  if (a.categories?.some(c => c.type === 'event') ||
      /\bvs\.?\b|\bdefeats?\b|\bbeats?\b|\bgame\b|\bscore\b/i.test(a.headline||'')) return 'matches';
  if (a.categories?.some(c => c.type === 'team')) return 'teams';
  return 'general';
}
const CAT_LABELS = { players:'Players', teams:'Teams', matches:'Match', general:'NBA' };

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

try {
  const a = JSON.parse(localStorage.getItem('baskettap_article') || 'null');
  if (!a) throw new Error('no article');

  document.title = `${a.headline || 'Article'} — BasketTap`;
  document.querySelector('meta[property="og:title"]').setAttribute('content', `${a.headline || 'Article'} — BasketTap`);
  if (a.description) document.querySelector('meta[property="og:description"]').setAttribute('content', a.description);
  document.querySelector('meta[name="twitter:title"]').setAttribute('content', `${a.headline || 'Article'} — BasketTap`);
  if (a.description) document.querySelector('meta[name="twitter:description"]').setAttribute('content', a.description);

  const cat    = getCatType(a);
  const img    = a.images?.[0]?.url || '';
  const date   = fmtDate(a.published);
  const url    = a.links?.web?.href || '#';
  const desc = a.description || '';

  document.getElementById('art-page').innerHTML = `
    <div class="art-img-wrap">
      ${img
        ? `<img src="${esc(img)}" alt="${esc(a.headline||'')}" />`
        : `<div class="no-img-big">🏀</div>`}
    </div>
    <span class="art-badge ${cat}">${CAT_LABELS[cat]}</span>
    <h1 class="art-title">${esc(a.headline||'')}</h1>
    ${date ? `<div class="art-date">${esc(date)}</div>` : ''}
    <div class="art-divider"></div>
    ${desc ? `<p class="art-desc">${esc(desc)}</p>` : ''}
    ${url !== '#'
      ? `<div class="art-full-hint">Full article available on the source site</div>
         <a class="art-ext-btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">
           Read Full Article <span class="art-ext-arrow">→</span>
         </a>`
      : ''}
  `;
  document.getElementById('game-promo-wrap').hidden = false;
} catch(e) {
  document.getElementById('art-page').innerHTML = `
    <div style="padding:80px 0;text-align:center">
      <div style="font-size:40px;margin-bottom:16px">📡</div>
      <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)">
        Article not found. <a href="news.html" style="color:var(--orange)">Back to News</a>
      </div>
    </div>`;
}
</script>
</body>
</html>
