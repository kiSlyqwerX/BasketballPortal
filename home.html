<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BasketTap</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange:   #ff6a00;
      --diamond:  #67e8f9;
      --bg:       #0a0a0a;
      --text:     #e8e8e8;
      --muted:    rgba(255,255,255,0.32);
      --border:   rgba(255,255,255,0.07);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }

    body {
      background:var(--bg);
      font-family:'Inter', sans-serif;
      color:var(--text);
      overflow:hidden;
      animation:pageIn 0.34s cubic-bezier(0.22,1,0.36,1);
    }
    body.exit { animation:pageOut 0.27s cubic-bezier(0.55,0,1,0.45) forwards; }

    @keyframes pageIn  { from{opacity:0;transform:translateX(55px)} to{opacity:1;transform:translateX(0)} }
    @keyframes pageOut { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(-55px)} }

    /* ── Blue screen border ── */
    .page-wrap {
      width:100%; height:100dvh;
      display:flex; flex-direction:column;
      border:1px solid rgba(30,120,255,0.45);
      outline:1px dashed rgba(30,120,255,0.15);
      outline-offset:-8px;
      position:relative; overflow:hidden;
    }

    /* ── HEADER ── */
    header {
      display:flex; align-items:center; justify-content:space-between;
      padding:0 28px; height:50px;
      border-bottom:1px solid rgba(30,120,255,0.22);
      flex-shrink:0; position:relative;
    }

    .header-left  { display:flex; align-items:center; gap:12px; }
    .header-right { display:flex; align-items:center; gap:14px; }

    .logo {
      font-family:'Bebas Neue', sans-serif;
      font-size:26px; letter-spacing:6px; color:var(--orange);
    }

    .diamond-counter {
      display:flex; align-items:center; gap:4px;
      font-family:'Bebas Neue', sans-serif;
      font-size:17px; color:var(--diamond); letter-spacing:1px;
    }
    .diamond-icon { font-size:13px; }

    .home-nav {
      position:absolute; left:50%; transform:translateX(-50%);
      display:flex; gap:26px; align-items:center;
      list-style:none;
    }

    .home-nav a {
      font-size:11px; font-weight:600; letter-spacing:2px;
      text-transform:uppercase; text-decoration:none;
      color:var(--muted); transition:color 0.18s;
    }
    .home-nav a.active { color:var(--orange); }
    .home-nav a:hover  { color:var(--text); }

    .record-display {
      font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
    }
    .record-display span {
      font-family:'Bebas Neue', sans-serif; font-size:15px;
      color:var(--orange); letter-spacing:1px; vertical-align:middle;
    }

    /* ── HERO ── */
    .hero {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:flex-start;
      padding-top:9vh; position:relative; overflow:hidden;
    }

    .hero-title {
      font-family:'Bebas Neue', sans-serif;
      font-size:clamp(30px, 5.5vw, 70px);
      color:#fff; letter-spacing:4px;
      text-align:center; line-height:1.05;
      max-width:900px; margin-bottom:18px;
    }

    .hero-sub {
      font-size:11px; letter-spacing:3.5px;
      text-transform:uppercase; color:var(--muted);
      margin-bottom:48px;
    }

    .hero-btns { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }

    .btn-play {
      background:var(--orange); border:none; border-radius:50px;
      padding:14px 56px;
      font-family:'Bebas Neue', sans-serif; font-size:20px;
      letter-spacing:3px; color:#fff; cursor:pointer;
      transition:opacity 0.15s, transform 0.1s;
    }
    .btn-play:hover  { opacity:0.86; }
    .btn-play:active { transform:scale(0.95); }

    .btn-news {
      background:transparent;
      border:1.5px solid rgba(255,255,255,0.22);
      border-radius:50px; padding:14px 56px;
      font-family:'Bebas Neue', sans-serif; font-size:20px;
      letter-spacing:3px; color:rgba(255,255,255,0.70); cursor:pointer;
      transition:border-color 0.18s, color 0.18s;
    }
    .btn-news:hover { border-color:rgba(255,255,255,0.50); color:#fff; }

    /* ── BALL ── */
    @keyframes homeballIn {
      0%   { transform:translate(-50%, 70%) scale(1.9) rotate(0deg);   opacity:0; }
      20%  { opacity:1; }
      72%  { transform:translate(-50%, 50%) scale(0.93) rotate(680deg); }
      88%  { transform:translate(-50%, 50%) scale(1.05) rotate(710deg); }
      100% { transform:translate(-50%, 50%) scale(1)    rotate(720deg); }
    }

    .ball-stage {
      position:absolute;
      bottom:0; left:50%;
      transform:translate(-50%, 50%);
      width:clamp(300px, 46vw, 580px);
      height:clamp(300px, 46vw, 580px);
      pointer-events:none;
      animation:homeballIn 1.1s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .ball-stage svg {
      width:100%; height:100%;
      border-radius:50%; overflow:hidden;
      filter:drop-shadow(0 30px 60px rgba(0,0,0,0.80));
    }

    /* ── FOOTER ── */
    footer {
      height:34px; display:flex; align-items:center; justify-content:center;
      border-top:1px solid rgba(30,120,255,0.18); flex-shrink:0;
    }

    .foot-online {
      display:flex; align-items:center; gap:6px;
      font-size:8px; letter-spacing:2px; text-transform:uppercase;
      color:rgba(255,255,255,0.22);
    }

    .foot-dot {
      width:5px; height:5px; border-radius:50%;
      background:var(--orange);
      box-shadow:0 0 6px rgba(255,106,0,0.70);
      animation:pulse 2s infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(1.6)} }

    /* ── MOBILE BOTTOM NAV ── */
    .mob-nav {
      display:none; position:fixed; bottom:0; left:0; right:0; height:60px;
      background:rgba(10,10,10,0.97); border-top:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      z-index:40; align-items:center; justify-content:space-around; padding:0 8px;
    }
    .mob-nav a {
      display:flex; flex-direction:column; align-items:center; gap:3px; min-width:68px;
      font-size:9px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase;
      color:rgba(255,255,255,0.28); text-decoration:none; padding:7px 12px; border-radius:12px;
      transition:color 0.18s, background 0.18s; -webkit-tap-highlight-color:transparent;
    }
    .mob-nav a:active { background:rgba(255,255,255,0.05); }
    .mob-nav a.active { color:var(--orange); background:rgba(255,106,0,0.12); }
    .mob-nav-icon { font-size:20px; line-height:1.1; }
    .mob-nav-dot  { width:3px; height:3px; border-radius:50%; background:transparent; margin-top:1px; }
    .mob-nav a.active .mob-nav-dot { background:var(--orange); }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      .home-nav     { display:none; }
      .record-display { display:none; }
      header        { padding:0 16px; }
      .hero         { padding-top:5vh; padding-bottom:68px; }
      .hero-title   { font-size:clamp(26px,8vw,48px); padding:0 16px; }
      .hero-sub     { margin-bottom:28px; }
      .hero-btns    { flex-direction:column; align-items:stretch; padding:0 20px; gap:10px; }
      .btn-play, .btn-news { text-align:center; padding:13px; font-size:18px; }
      .ball-stage   { width:min(80vw,320px); height:min(80vw,320px); }
      .mob-nav      { display:flex; }
    }
  </style>
</head>
<body>
<div class="page-wrap">

  <header>
    <div class="header-left">
      <div class="logo">BasketTap</div>
    </div>

    <ul class="home-nav">
      <li><a href="home.html" class="active">Home</a></li>
      <li><a href="index.html" onclick="navigate(event,'index.html')">Game</a></li>
      <li><a href="news.html" onclick="navigate(event,'news.html')">News</a></li>
    </ul>

    <div class="header-right">
      <div class="diamond-counter"><span class="diamond-icon">💎</span><span id="diamond-display">0</span></div>
      <div class="record-display">Record&nbsp;<span id="record-val">0</span></div>
    </div>
  </header>

  <main class="hero">
    <h1 class="hero-title">First Tap Basketball<br>Game in the World</h1>
    <p class="hero-sub">Just try it bro...</p>
    <div class="hero-btns">
      <button class="btn-play" onclick="navigate(null,'index.html')">Play Now</button>
      <button class="btn-news" onclick="navigate(null,'news.html')">News</button>
    </div>

    <!-- Basketball SVG (same as in the game) -->
    <div class="ball-stage">
      <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="ballGrad" cx="34%" cy="30%" r="70%">
            <stop offset="0%"   stop-color="#ffc060"/>
            <stop offset="34%"  stop-color="#ff8c00"/>
            <stop offset="66%"  stop-color="#cc5500"/>
            <stop offset="100%" stop-color="#7a2800"/>
          </radialGradient>
          <clipPath id="ballClip">
            <circle cx="130" cy="130" r="128"/>
          </clipPath>
        </defs>
        <g clip-path="url(#ballClip)">
          <circle cx="130" cy="130" r="128" fill="url(#ballGrad)"/>
          <path d="M130 8 Q178 68 178 130 Q178 192 130 252" stroke="rgba(50,12,0,.58)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <path d="M130 8 Q82 68 82 130 Q82 192 130 252"   stroke="rgba(50,12,0,.58)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <path d="M8 130 Q68 96 130 96 Q192 96 252 130"   stroke="rgba(50,12,0,.58)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <path d="M8 130 Q68 164 130 164 Q192 164 252 130" stroke="rgba(50,12,0,.58)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="88" cy="78" rx="28" ry="13" fill="rgba(255,235,160,.10)" transform="rotate(-22,88,78)"/>
        </g>
      </svg>
    </div>
  </main>

  <footer>
    <div class="foot-online">
      <div class="foot-dot"></div>
      Online
    </div>
  </footer>

</div>

<nav class="mob-nav">
  <a class="active" href="home.html">
    <span class="mob-nav-icon">🏠</span><span>Home</span><span class="mob-nav-dot"></span>
  </a>
  <a href="index.html" onclick="navigate(event,'index.html')">
    <span class="mob-nav-icon">🏀</span><span>Game</span><span class="mob-nav-dot"></span>
  </a>
  <a href="news.html" onclick="navigate(event,'news.html')">
    <span class="mob-nav-icon">📰</span><span>News</span><span class="mob-nav-dot"></span>
  </a>
</nav>

<script>
const d = JSON.parse(localStorage.getItem('baskettap_v3') || '{}');
try {
  if (d.diamonds != null) document.getElementById('diamond-display').textContent = d.diamonds;
  if (d.record   != null) document.getElementById('record-val').textContent = fmtBig(d.record);
} catch(e) {}

function fmtBig(n) {
  if (n >= 1e6)  return (n/1e6).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'K';
  return String(Math.floor(n || 0));
}

function navigate(e, href) {
  if (e) e.preventDefault();
  document.body.classList.add('exit');
  setTimeout(() => { window.location.href = href; }, 270);
}
</script>
</body>
</html>
