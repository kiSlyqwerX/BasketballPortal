<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BasketTap — Latest NBA & Basketball News</title>
  <meta name="description" content="Stay up to date with the latest NBA and basketball news. Players, teams, game results and highlights — all in one place on BasketTap." />
  <meta name="keywords" content="NBA news, basketball news, NBA players, basketball teams, game results, basketball highlights" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#ff6a00" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="canonical" href="https://baskettap.com/news" />
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://baskettap.com/news" />
  <meta property="og:title" content="BasketTap — Latest NBA & Basketball News" />
  <meta property="og:description" content="Stay up to date with the latest NBA and basketball news. Players, teams, game results and highlights — all in one place." />
  <meta property="og:site_name" content="BasketTap" />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BasketTap — Latest NBA & Basketball News" />
  <meta name="twitter:description" content="Stay up to date with the latest NBA and basketball news. Players, teams, game results and highlights — all in one place." />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange:   #ff6a00;
      --diamond:  #67e8f9;
      --green:    #22c55e;
      --bg:       #0a0a0a;
      --surface:  #141414;
      --surface2: #1e1e1e;
      --text:     #e8e8e8;
      --muted:    rgba(255,255,255,0.72);
      --border:   rgba(255,255,255,0.10);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    html { overflow-x:hidden; }
    body {
      background:var(--bg); font-family:'Inter',sans-serif;
      color:var(--text); overflow:hidden;
      animation:pageIn 0.34s cubic-bezier(0.22,1,0.36,1);
    }
    body.back      { animation:pageInBack  0.34s cubic-bezier(0.22,1,0.36,1); }
    body.exit      { animation:pageOut     0.27s cubic-bezier(0.55,0,1,0.45) forwards; }
    body.exit.back { animation:pageOutBack 0.27s cubic-bezier(0.55,0,1,0.45) forwards; }
    @keyframes pageIn      { from{opacity:0;transform:translateX( 55px)} to{opacity:1;transform:translateX(0)} }
    @keyframes pageInBack  { from{opacity:0;transform:translateX(-55px)} to{opacity:1;transform:translateX(0)} }
    @keyframes pageOut     { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(-55px)} }
    @keyframes pageOutBack { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX( 55px)} }

    .page-wrap {
      width:100%; height:100dvh; display:flex; flex-direction:column;
      border:1px solid rgba(30,120,255,0.45);
      outline:1px dashed rgba(30,120,255,0.15); outline-offset:-8px;
    }

    /* ── HEADER ── */
    header {
      display:flex; align-items:center; justify-content:space-between;
      padding:0 28px; height:50px;
      border-bottom:1px solid rgba(30,120,255,0.22);
      flex-shrink:0; position:relative;
    }
    .header-left  { display:flex; align-items:center; gap:12px; }
    .header-right { display:flex; align-items:center; gap:14px; }
    .logo { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:6px; color:var(--orange); }
    .diamond-counter { display:flex; align-items:center; gap:4px; font-family:'Bebas Neue',sans-serif; font-size:17px; color:var(--diamond); letter-spacing:1px; }
    .home-nav { position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:26px; list-style:none; }
    .home-nav a { font-size:11px; font-weight:600; letter-spacing:2px; text-transform:uppercase; text-decoration:none; color:var(--muted); transition:color 0.18s; }
    .home-nav a.active { color:var(--orange); }
    .home-nav a:hover  { color:var(--text); }
    .record-display { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
    .record-display span { font-family:'Bebas Neue',sans-serif; font-size:15px; color:var(--orange); vertical-align:middle; }

    /* ── LAYOUT ── */
    .news-layout { display:flex; flex:1; overflow:hidden; }

    /* ── SIDEBAR ── */
    .news-sidebar {
      width:210px; flex-shrink:0;
      border-right:1px solid rgba(30,120,255,0.18);
      padding:22px 16px; display:flex; flex-direction:column; gap:4px;
    }
    .sidebar-title {
      font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:4px; color:var(--diamond);
      padding-bottom:10px; border-bottom:1px solid rgba(103,232,249,0.18); margin-bottom:6px;
    }
    .cat-item {
      display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:8px;
      font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase;
      color:var(--muted); cursor:pointer;
      border:1px solid transparent;
      transition:color 0.15s, background 0.15s, border-color 0.15s;
    }
    .cat-item:hover { color:var(--text); background:rgba(255,255,255,0.04); }
    .cat-item.active { color:var(--orange); border-color:rgba(255,106,0,0.30); background:rgba(255,106,0,0.06); }
    .cat-dot { width:7px; height:7px; border-radius:50%; background:var(--orange); flex-shrink:0; opacity:0; transition:opacity 0.15s; }
    .cat-item.active .cat-dot { opacity:1; }

    /* ── MOBILE CATEGORY PILLS ── */
    .mob-cats {
      display:none; overflow-x:auto; gap:8px; padding:0 16px 12px;
      flex-shrink:0; scrollbar-width:none;
    }
    .mob-cats::-webkit-scrollbar { display:none; }
    .mob-cat {
      display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
      padding:6px 13px; border-radius:20px; border:1px solid var(--border);
      font-size:10px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase;
      color:var(--muted); background:var(--surface); cursor:pointer; flex-shrink:0;
      transition:color 0.15s, border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color:transparent;
    }
    .mob-cat.active { color:var(--orange); border-color:rgba(255,106,0,0.45); background:rgba(255,106,0,0.08); }
    .mob-cat-dot { width:5px; height:5px; border-radius:50%; background:var(--orange); opacity:0; transition:opacity 0.15s; }
    .mob-cat.active .mob-cat-dot { opacity:1; }

    /* ── CONTENT ── */
    .news-content { flex:1; overflow-y:auto; padding:24px 24px 24px; }
    .news-content::-webkit-scrollbar { width:3px; }
    .news-content::-webkit-scrollbar-thumb { background:rgba(255,106,0,0.3); border-radius:2px; }

    .news-section-title {
      font-family:'Bebas Neue',sans-serif; font-size:clamp(18px,2.2vw,26px);
      letter-spacing:5px; color:var(--text); margin-bottom:18px;
    }

    /* ── GRID ── */
    .news-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }

    /* ── CARD ── */
    .news-card {
      display:flex; flex-direction:column;
      border:1px solid var(--border); border-radius:14px;
      overflow:hidden; background:var(--surface);
      text-decoration:none; color:inherit;
      transition:border-color 0.24s, transform 0.24s, box-shadow 0.24s;
      -webkit-tap-highlight-color:transparent;
    }
    .news-card:hover {
      border-color:rgba(255,106,0,0.40);
      transform:translateY(-5px);
      box-shadow:0 24px 64px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,106,0,0.10);
    }
    .news-card:active { transform:translateY(-2px); }

    /* Image — fixed 16/9 */
    .card-img-wrap {
      position:relative; width:100%; aspect-ratio:16/9;
      background:var(--surface2); overflow:hidden; flex-shrink:0;
    }
    .card-img-wrap img {
      width:100%; height:100%; object-fit:cover; display:block;
      transition:transform 0.45s ease;
    }
    .news-card:hover .card-img-wrap img { transform:scale(1.07); }
    .card-img-wrap::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(to bottom,transparent 45%,rgba(0,0,0,0.52) 100%);
      pointer-events:none;
    }
    .no-img {
      width:100%; height:100%;
      display:flex; align-items:center; justify-content:center; font-size:46px;
      background:linear-gradient(135deg,var(--surface2) 0%,rgba(255,106,0,0.07) 100%);
    }

    /* Category badge — frosted glass */
    .card-badge {
      position:absolute; top:10px; left:10px; z-index:1;
      font-size:8px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
      padding:4px 9px; border-radius:5px; color:#fff;
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    }
    .card-badge.players { background:rgba(255,106,0,0.85); }
    .card-badge.teams   { background:rgba(14,165,233,0.85); }
    .card-badge.matches { background:rgba(34,197,94,0.85); }
    .card-badge.general { background:rgba(255,255,255,0.22); }

    /* Body */
    .card-body { flex:1; padding:15px 16px 14px; display:flex; flex-direction:column; }

    .card-title {
      font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:0.8px;
      color:var(--text); line-height:1.2; margin-bottom:8px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
      transition:color 0.18s;
    }
    .news-card:hover .card-title { color:#fff; }

    .card-desc {
      font-size:11.5px; color:rgba(255,255,255,0.58); line-height:1.65; flex:1;
      display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    }

    .card-footer {
      display:flex; align-items:center; justify-content:space-between;
      margin-top:12px; padding-top:10px;
      border-top:1px solid rgba(255,255,255,0.06);
    }

    .card-meta { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,0.38); }

    .card-read {
      display:inline-flex; align-items:center; gap:5px;
      font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
      color:var(--orange); transition:gap 0.18s;
    }
    .news-card:hover .card-read { gap:10px; }

    /* ── SKELETON ── */
    .skel-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
    .skel-card { display:flex; flex-direction:column; border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--surface); }
    .skel-img  { width:100%; aspect-ratio:16/9; background:var(--surface2); }
    .skel-body { padding:15px 16px; display:flex; flex-direction:column; gap:10px; }
    .skel-line { height:10px; background:var(--surface2); border-radius:4px; animation:shimmer 1.5s ease-in-out infinite; }
    @keyframes shimmer { 0%,100%{opacity:0.30} 50%{opacity:0.70} }

    /* ── ERROR ── */
    .news-error { display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:60px 0; text-align:center; }
    .news-error.visible { display:flex; }
    .err-icon { font-size:38px; }
    .err-text { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
    .retry-btn { background:transparent; border:1px solid rgba(255,106,0,0.4); border-radius:6px; padding:8px 20px; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:3px; color:var(--orange); cursor:pointer; transition:background 0.15s; }
    .retry-btn:hover { background:rgba(255,106,0,0.08); }

    /* ── MOBILE BOTTOM NAV ── */
    .mob-nav {
      display:none; position:fixed; bottom:0; left:0; right:0; height:60px;
      background:rgba(10,10,10,0.97); border-top:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      z-index:40; align-items:center; justify-content:space-around; padding:0 8px;
    }
    .mob-nav a { display:flex; flex-direction:column; align-items:center; gap:3px; min-width:68px; font-size:9px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,0.65); text-decoration:none; padding:7px 12px; border-radius:12px; transition:color 0.18s, background 0.18s; -webkit-tap-highlight-color:transparent; }
    .mob-nav a:active { background:rgba(255,255,255,0.05); }
    .mob-nav a.active { color:var(--orange); background:rgba(255,106,0,0.12); }
    .mob-nav-icon { font-size:20px; line-height:1.1; }
    .mob-nav-dot  { width:3px; height:3px; border-radius:50%; background:transparent; margin-top:1px; }
    .mob-nav a.active .mob-nav-dot { background:var(--orange); }

    /* ── FOOTER ── */
    footer { height:34px; display:flex; align-items:center; justify-content:center; border-top:1px solid rgba(30,120,255,0.18); flex-shrink:0; }
    .foot-online { display:flex; align-items:center; gap:6px; font-size:8px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.30); }
    .foot-dot { width:5px; height:5px; border-radius:50%; background:var(--orange); box-shadow:0 0 6px rgba(255,106,0,0.70); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(1.6)} }

    /* ── LIVE BADGE ── */
    .news-header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .news-header-row .news-section-title { margin-bottom:0; }
    .live-badge { display:flex; align-items:center; gap:6px; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
    .live-dot { width:6px; height:6px; border-radius:50%; background:#22c55e; box-shadow:0 0 6px rgba(34,197,94,0.7); animation:pulse 2s infinite; flex-shrink:0; }

    /* ── LARGE MONITORS ── */
    @media (min-width:1400px) {
      .news-sidebar   { width:260px; padding:26px 20px; }
      .sidebar-title  { font-size:19px; letter-spacing:5px; }
      .cat-item       { font-size:11px; padding:11px 14px; }
      .news-content   { padding:28px 32px 28px; }
      .news-grid      { grid-template-columns:repeat(3,1fr); gap:18px; }
      .skel-grid      { grid-template-columns:repeat(3,1fr); gap:18px; }
      .card-title     { font-size:19px; }
      .news-section-title { font-size:clamp(20px,2.4vw,30px); }
    }
    @media (min-width:1800px) {
      .news-sidebar   { width:320px; padding:32px 26px; gap:6px; }
      .sidebar-title  { font-size:22px; letter-spacing:6px; margin-bottom:10px; }
      .cat-item       { font-size:12px; padding:13px 16px; border-radius:10px; }
      .cat-dot        { width:9px; height:9px; }
      .news-content   { padding:36px 48px 36px; }
      .news-grid      { gap:22px; }
      .skel-grid      { gap:22px; }
      .card-title     { font-size:21px; }
      .card-desc      { font-size:12px; }
      .card-meta      { font-size:10px; }
      .news-section-title { font-size:clamp(24px,2.2vw,36px); }
      header          { padding:0 36px; height:58px; }
    }
    @media (min-width:2200px) {
      .news-sidebar   { width:400px; padding:40px 32px; }
      .sidebar-title  { font-size:26px; }
      .cat-item       { font-size:13px; padding:15px 18px; }
      .news-content   { padding:48px 64px; }
      .news-grid      { gap:28px; }
      .card-title     { font-size:24px; }
      .card-desc      { font-size:14px; }
      .card-body      { padding:18px 18px 16px; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width:700px) {
      .home-nav       { display:none; }
      .record-display { display:none; }
      header          { padding:0 16px; }
      .news-sidebar   { display:none; }
      .mob-cats       { display:flex; }
      .news-content   { padding:12px 12px 76px; }
      .news-section-title { font-size:18px; letter-spacing:3px; margin-bottom:12px; }
      .news-grid      { grid-template-columns:1fr; gap:10px; }
      .skel-grid      { grid-template-columns:1fr; gap:10px; }
      .card-body      { padding:12px 13px 11px; }
      .card-title     { font-size:16px; margin-bottom:6px; }
      .card-desc      { font-size:11px; -webkit-line-clamp:2; }
      .card-footer    { margin-top:9px; padding-top:8px; }
      .card-meta      { font-size:8px; }
      .card-read      { font-size:8px; letter-spacing:1.5px; }
      .mob-nav        { display:flex; }
      footer          { display:none; }
    }
  </style>
</head>
<body>
<script>(function(){var d=sessionStorage.getItem('bt_dir');sessionStorage.removeItem('bt_dir');if(d==='back')document.body.classList.add('back');})()</script>
<div class="page-wrap">

  <header>
    <div class="header-left"><div class="logo">BasketTap</div></div>
    <ul class="home-nav">
      <li><a href="home.html" onclick="navigate(event,'home.html','back')">Home</a></li>
      <li><a href="index.html" onclick="navigate(event,'index.html','back')">Game</a></li>
      <li><a href="news.html" class="active">News</a></li>
    </ul>
    <div class="header-right">
      <div class="diamond-counter">💎 <span id="diamond-display">0</span></div>
      <div class="record-display">Record&nbsp;<span id="record-val">0</span></div>
    </div>
  </header>

  <div class="news-layout">

    <aside class="news-sidebar">
      <div class="sidebar-title">Categories</div>
      <div class="cat-item active" data-cat="all"     onclick="setCategory('all')"><span class="cat-dot"></span>Latest News</div>
      <div class="cat-item"        data-cat="players" onclick="setCategory('players')"><span class="cat-dot"></span>Players</div>
      <div class="cat-item"        data-cat="teams"   onclick="setCategory('teams')"><span class="cat-dot"></span>Teams</div>

    </aside>

    <div class="news-content">
      <div class="news-header-row">
        <div class="news-section-title" id="section-title">Latest Basketball News</div>
        <div class="live-badge"><span class="live-dot"></span><span id="last-updated">Live</span></div>
      </div>

      <div class="mob-cats">
        <div class="mob-cat active" data-cat="all"     onclick="setCategory('all')"><span class="mob-cat-dot"></span>Latest</div>
        <div class="mob-cat"        data-cat="players" onclick="setCategory('players')"><span class="mob-cat-dot"></span>Players</div>
        <div class="mob-cat"        data-cat="teams"   onclick="setCategory('teams')"><span class="mob-cat-dot"></span>Teams</div>
        <div class="mob-cat"        data-cat="matches" onclick="setCategory('matches')"><span class="mob-cat-dot"></span>Matches</div>
      </div>

      <div id="loading-area"></div>
      <div class="news-grid" id="news-grid" style="display:none"></div>
      <div class="news-error" id="news-error">
        <div class="err-icon">📡</div>
        <div class="err-text">Couldn't load news. Check connection.</div>
        <button class="retry-btn" onclick="loadNews()">Retry</button>
      </div>
    </div>
  </div>

  <footer><div class="foot-online"><div class="foot-dot"></div>Online</div></footer>

</div>

<nav class="mob-nav">
  <a href="home.html" onclick="navigate(event,'home.html','back')"><span class="mob-nav-icon">🏠</span><span>Home</span><span class="mob-nav-dot"></span></a>
  <a href="index.html" onclick="navigate(event,'index.html','back')"><span class="mob-nav-icon">🏀</span><span>Game</span><span class="mob-nav-dot"></span></a>
  <a class="active" href="news.html"><span class="mob-nav-icon">📰</span><span>News</span><span class="mob-nav-dot"></span></a>
</nav>

<script>
try {
  const d = JSON.parse(localStorage.getItem('baskettap_v3') || '{}');
  if (d.diamonds != null) document.getElementById('diamond-display').textContent = d.diamonds;
  if (d.record   != null) document.getElementById('record-val').textContent = fmtBig(d.record);
} catch(e) {}

function fmtBig(n) {
  if (n >= 1e6)  return (n/1e6).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'K';
  return String(Math.floor(n || 0));
}

function navigate(e, href, dir) {
  if (e) e.preventDefault();
  sessionStorage.setItem('bt_dir', dir || 'forward');
  document.body.classList.add('exit');
  if (dir === 'back') document.body.classList.add('back');
  setTimeout(() => { window.location.href = href; }, 270);
}

const ESPN_URL  = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/news?limit=30';
const CACHE_KEY  = 'baskettap_news_v2';
const CACHE_TTL  = 2 * 60 * 60 * 1000; // 2 hours

let articles    = [];
let activeCat   = 'all';
let lastFetched = 0;

const CAT_TITLES = {
  all:     'Latest Basketball News',
  players: 'Player News',
  teams:   'Team News',
  matches: 'Game Results & Previews',
};

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
  catch(e) { return ''; }
}

function getCatType(a) {
  if (a.categories?.some(c => c.type === 'athlete')) return 'players';
  if (a.categories?.some(c => c.type === 'event') ||
      /\bvs\.?\b|\bdefeats?\b|\bbeats?\b|\bgame\b|\bscore\b/i.test(a.headline || '')) return 'matches';
  if (a.categories?.some(c => c.type === 'team')) return 'teams';
  return 'general';
}

const CAT_LABELS = { players:'Players', teams:'Teams', matches:'Match', general:'NBA' };

function updateTimestamp() {
  const el = document.getElementById('last-updated');
  if (!el || !lastFetched) return;
  const mins = Math.floor((Date.now() - lastFetched) / 60000);
  if (mins < 1)   el.textContent = 'Just updated';
  else if (mins < 60) el.textContent = `${mins}m ago`;
  else            el.textContent = `${Math.floor(mins/60)}h ago`;
}

function buildSkeleton() {
  const wrap = document.createElement('div');
  wrap.className = 'skel-grid';
  wrap.innerHTML = `
    <div class="skel-card"><div class="skel-img"></div><div class="skel-body">
      <div class="skel-line" style="width:90%"></div>
      <div class="skel-line" style="width:70%"></div>
      <div class="skel-line" style="width:50%"></div>
    </div></div>
  `.repeat(8);
  return wrap;
}

const MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000; // hide articles older than 7 days

function filterArticles() {
  const cutoff = Date.now() - MAX_AGE_MS;
  let filtered = articles.filter(a => {
    if (!a.published) return true;
    return new Date(a.published).getTime() > cutoff;
  });
  if (activeCat !== 'all') {
    filtered = filtered.filter(a => getCatType(a) === activeCat);
  }
  return filtered;
}

function renderGrid() {
  const loadArea = document.getElementById('loading-area');
  const grid     = document.getElementById('news-grid');
  loadArea.innerHTML = '';

  const filtered = filterArticles();
  if (!filtered.length) {
    grid.style.display = 'none';
    loadArea.innerHTML = `<div style="padding:50px 0;text-align:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);">No news in this category</div>`;
    return;
  }

  grid.innerHTML = filtered.map(a => {
    const realIdx = articles.indexOf(a);
    const img  = a.images?.[0]?.url || '';
    const cat  = getCatType(a);
    const date = fmtDate(a.published);

    return `<a class="news-card" href="article.html" onclick="openArticle(event,${realIdx})">
      <div class="card-img-wrap">
        ${img
          ? `<img src="${esc(img)}" alt="${esc(a.headline||'')}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=no-img>🏀</div>'">`
          : `<div class="no-img">🏀</div>`}
        <span class="card-badge ${cat}">${esc(CAT_LABELS[cat])}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${esc(a.headline || '')}</div>
        <div class="card-desc">${esc(a.description || '')}</div>
        <div class="card-footer">
          ${date ? `<div class="card-meta">${esc(date)}</div>` : '<div></div>'}
          <span class="card-read">Read →</span>
        </div>
      </div>
    </a>`;
  }).join('');

  grid.style.display = 'grid';
}

async function fetchFresh(silent = false) {
  const loadArea = document.getElementById('loading-area');
  const grid     = document.getElementById('news-grid');
  const errEl    = document.getElementById('news-error');
  try {
    const res  = await fetch(ESPN_URL + '&_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const fresh = data.articles || [];
    if (!fresh.length) throw new Error('empty');

    articles    = fresh;
    lastFetched = Date.now();
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: lastFetched, articles })); } catch(e) {}

    loadArea.innerHTML = '';
    updateTimestamp();
    renderGrid();
  } catch(err) {
    if (!silent) {
      loadArea.innerHTML = '';
      grid.style.display = 'none';
      errEl.classList.add('visible');
    }
  }
}

async function loadNews() {
  const loadArea = document.getElementById('loading-area');
  const errEl    = document.getElementById('news-error');
  errEl.classList.remove('visible');

  // Load from cache instantly if fresh enough
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (cached?.articles?.length && (Date.now() - cached.ts) < CACHE_TTL) {
      articles    = cached.articles;
      lastFetched = cached.ts;
      updateTimestamp();
      renderGrid();
      // Still refresh in background silently
      fetchFresh(true);
      return;
    }
  } catch(e) {}

  // No valid cache — show skeleton and fetch
  loadArea.innerHTML = '';
  loadArea.appendChild(buildSkeleton());
  await fetchFresh(false);
}

function openArticle(e, idx) {
  e.preventDefault();
  try { localStorage.setItem('baskettap_article', JSON.stringify(articles[idx])); } catch(e) {}
  sessionStorage.setItem('bt_dir', 'forward');
  document.body.classList.add('exit');
  setTimeout(() => { window.location.href = 'article.html'; }, 270);
}

function setCategory(cat) {
  activeCat = cat;
  document.querySelectorAll('[data-cat]').forEach(e => {
    e.classList.toggle('active', e.dataset.cat === cat);
  });
  document.getElementById('section-title').textContent = CAT_TITLES[cat] || CAT_TITLES.all;
  if (articles.length) renderGrid();
}

// Auto-refresh every 2 hours while page is open
setInterval(() => fetchFresh(true), CACHE_TTL);
// Update "X min ago" every minute
setInterval(updateTimestamp, 60000);

loadNews();
</script>
</body>
